 if(S.run){S.el+=dt;if(S.el-S.lh>=1){S.lh=S.el;S.hist.push({t:Date.now(),el:S.el})}if(M&&S.src&&!S.dl)dloop()}
 draw(now);requestAnimationFrame(loop)}

const xhr=(m,u,h,b)=>new Promise(r=>{const x=new XMLHttpRequest();x.open(m,u);for(const k in h)x.setRequestHeader(k,h[k]);x.onload=()=>r(x);x.onerror=()=>r(null);x.send(b)});
async function connect(){const id=$('cid').value.trim();if(!id){msg('Settings-e Google Client ID dao (README dekho).');return 0}save();
 try{if(!window.google||!google.accounts)await ld('https://accounts.google.com/gsi/client')}catch(e){msg('Error: '+e.message);return 0}
 return new Promise(res=>{google.accounts.oauth2.initTokenClient({client_id:id,scope:'https://www.googleapis.com/auth/drive.file',callback:r=>{if(r.access_token){tok=r.access_token;tokT=Date.now()+((r.expires_in||3600)-120)*1000;res(1)}else{msg('Drive login fail: '+(r.error||''));res(0)}},error_callback:e=>{msg('Drive login fail: '+(e.type||''));res(0)}}).requestAccessToken({prompt:tok?'':'consent'})})}
const ens=async()=>(tok&&Date.now()<tokT)?1:connect();
async function getFolder(){if(folder)return folder;const x=await xhr('POST','https://www.googleapis.com/drive/v3/files',{Authorization:'Bearer '+tok,'Content-Type':'application/json'},JSON.stringify({name:'AI-CCTV',mimeType:'application/vnd.google-apps.folder'}));
 try{folder=JSON.parse(x.responseText).id;LS.s('cctvF',folder)}catch(e){}return folder}
class Up{constructor(n,mt){this.n=n;this.mt=mt;this.q=[];this.sent=0;this.loc=null;this.busy=0;this.done=0;this.fin=0;this.pend=0}
 st(){return this.fin?'✔ Drive-e save hoyeche':`☁ ${(this.sent/1048576).toFixed(1)} MB upload hoyeche, ${(this.pend/1048576).toFixed(1)} MB opekkhay`}
 push(b){this.q.push(b);this.pend+=b.size;this.pump()}
 async init(){if(!await ens())return 0;await getFolder();const m={name:this.n};if(folder)m.parents=[folder];
  const x=await xhr('POST','https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable',{Authorization:'Bearer '+tok,'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':this.mt},JSON.stringify(m));
  if(x&&x.status==200)this.loc=x.getResponseHeader('Location');else if(x&&x.status==401)tok=null;return !!this.loc}
 async pump(){if(this.busy)return;this.busy=1;try{for(;;){if(this.pend<CH&&!this.done)break;if(this.fin)break;
  if(!this.loc&&!await this.init()){await sleep(5000);continue}
  const last=this.done&&this.pend<=CH,n=last?this.pend:CH,all=new Blob(this.q),blob=all.slice(0,n);
  const x=await xhr('PUT',this.loc,{'Content-Range':n?`bytes ${this.sent}-${this.sent+n-1}/${last?this.sent+n:'*'}`:`bytes */${this.sent}`},blob);
  if(x&&(x.status==308||x.status==200||x.status==201)){this.q=[all.slice(n)];this.pend-=n;this.sent+=n;if(x.status!=308)this.fin=1}
  else{if(x&&x.status==401){tok=null}await sleep(4000)}}}finally{this.busy=0}}
 end(){this.done=1;this.pump()}}
async function upText(name,txt){if(!await ens())return;await getFolder();const m={name,parents:folder?[folder]:undefined};
 await xhr('POST','https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{Authorization:'Bearer '+tok,'Content-Type':'multipart/related; boundary=b0'},`--b0\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(m)}\r\n--b0\r\nContent-Type: text/csv\r\n\r\n${txt}\r\n--b0--`)}

const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()};
function seg(){const st=stream||(v.captureStream&&v.captureStream());const mt=['video/mp4','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t)),ext=mt.includes('mp4')?'.mp4':'.webm',drive=$('store').value=='drive';
 const name='cctv-'+stamp()+ext,up=drive?new Up(name,mt.split(';')[0]):null,ch=[];R.up=up;const mr=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:1500000});R.mr=mr;
 mr.ondataavailable=e=>{if(!e.data.size)return;up?up.push(e.data):ch.push(e.data)};
 mr.onstop=()=>{clearTimeout(R.t);if(up)up.end();else dl(new Blob(ch,{type:mt}),name);if(R.on)seg();else{$('rec').textContent='⏺ REC';$('rec').classList.remove('on');if(drive)upText('counts-'+stamp()+'.csv',csvText())}};
 mr.start(1000);R.t=setTimeout(()=>mr.state=='recording'&&mr.stop(),SEG)}
$('rec').onclick=async()=>{if(R&&R.on){R.on=0;R.mr.stop();return}if(!S.src){msg('Age camera chalao.');return}
 if($('store').value=='drive'&&!await ens()){msg('Drive connect hoy ni — Settings dekho ba "Save: Phone" select koro.');return}
 R={on:1};seg();$('rec').textContent='⏹ Stop REC';$('rec').classList.add('on')};
