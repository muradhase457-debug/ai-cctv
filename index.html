<script>
const $=id=>document.getElementById(id),c=$('c'),X=c.getContext('2d'),v=$('v');

const Z={in:{x:.16,y:.22,w:.32,h:.62,c:'#f59e0b',n:'Inbound'},out:{x:.52,y:.22,w:.32,h:.62,c:'#3b82f6',n:'Outbound'}};
let S={run:false,el:0,lh:-9,tracks:[],nid:1,objs:[],hist:[],live:{in:0,out:0},k:1,src:null,kind:'',edit:false,busy:0,last:0,date:new Date()},M=null,MN='',stream=null,rec=null,dr=null;
try{const j=JSON.parse(localStorage.getItem('cctvZ')||'null');if(j){for(const z in j)Object.assign(Z[z],j[z]);}$('loc').value=localStorage.getItem('cctvL')||$('loc').value}catch(e){}
const save=()=>{try{localStorage.setItem('cctvZ',JSON.stringify(Z));localStorage.setItem('cctvL',$('loc').value)}catch(e){}};
$('loc').onchange=save;const msg=t=>$('msg').textContent=t;
const cl=(a,b,d)=>Math.max(b,Math.min(d,a)),pad=n=>String(n).padStart(2,'0');
const fmt=s=>`${pad(s/3600|0)}:${pad(s/60%60|0)}:${pad(s%60|0)}s`;
/* ---------- demo scene (no camera / no internet needed) ---------- */
const dc=document.createElement('canvas');dc.width=640;dc.height=360;const D=dc.getContext('2d');let dobs=[],dsp=0;
function dstep(dt){dsp-=dt;if(dsp<=0){dsp=.35+Math.random()*.5;const o=Math.random()<.5,r=Math.random(),cls=r<.45?'car':r<.7?'motorcycle':r<.8?'person':r<.9?'truck':'bus';
 const s={car:[34,20],motorcycle:[14,22],person:[10,18],truck:[42,24],bus:[50,26]}[cls];
 dobs.push({cls,w:s[0],h:s[1],x:(o?.68:.32)*640+(Math.random()-.5)*70-s[0]/2,y:o?380:-30,vy:(o?-1:1)*(cls=='person'?35:70+Math.random()*50),col:COL[cls]})}
 dobs.forEach(o=>o.y+=o.vy*dt);dobs=dobs.filter(o=>o.y>-60&&o.y<400);
 D.fillStyle='#4a4d52';D.fillRect(0,0,640,360);D.fillStyle='#3a3c40';D.fillRect(150,0,340,360);
 D.strokeStyle='#e5e5e5';D.setLineDash([16,14]);D.lineWidth=3;D.beginPath();D.moveTo(320,0);D.lineTo(320,360);D.stroke();D.setLineDash([]);
 D.fillStyle='#d8d8d8';for(let i=0;i<10;i++)D.fillRect(160+i*32,300,18,38);
 dobs.forEach(o=>{D.fillStyle=o.col;D.fillRect(o.x,o.y,o.w,o.h);D.fillStyle='#0008';D.fillRect(o.x+3,o.y+4,o.w-6,o.h/3)})}
const ddet=()=>dobs.map(o=>({class:o.cls,score:.8+Math.random()*.15,bbox:[o.x+Math.random()*2,o.y+Math.random()*2,o.w,o.h]}));
/* ---------- tracking + zone counting ---------- */
const iou=(a,b)=>{const x=Math.max(a[0],b[0]),y=Math.max(a[1],b[1]),X2=Math.min(a[0]+a[2],b[0]+b[2]),Y2=Math.min(a[1]+a[3],b[1]+b[3]),i=Math.max(0,X2-x)*Math.max(0,Y2-y);return i/(a[2]*a[3]+b[2]*b[3]-i+1e-6)};
const best=v=>Object.keys(v).sort((a,b)=>v[b]-v[a])[0];
function upd(ds){const T=S.tracks,P=[],ui=new Set,uj=new Set;
 T.forEach(t=>{t.m=0;const f=t.miss+1;t.p=[t.b[0]+t.vx*f,t.b[1]+t.vy*f,t.b[2],t.b[3]]});
 ds.forEach((d,i)=>T.forEach((t,j)=>{const s=iou(t.p,d.b);if(s>.12)P.push([s,i,j])}));P.sort((a,b)=>b[0]-a[0]);
 P.forEach(([s,i,j])=>{if(ui.has(i)||uj.has(j))return;ui.add(i);uj.add(j);const t=T[j],d=ds[i];
  t.vx=.6*t.vx+.4*(d.b[0]-t.b[0])/(t.miss+1);t.vy=.6*t.vy+.4*(d.b[1]-t.b[1])/(t.miss+1);t.b=d.b;t.m=1;t.miss=0;t.age++;t.v[d.c]=(t.v[d.c]||0)+d.s});
 ds.forEach((d,i)=>{if(!ui.has(i))T.push({id:S.nid++,b:d.b,vx:0,vy:0,age:1,miss:0,m:1,v:{[d.c]:d.s},zone:null})});
 T.forEach(t=>{if(!t.m)t.miss++;t.cls=best(t.v)});S.tracks=T.filter(t=>t.miss<14);
 const L={in:0,out:0};
 S.tracks.forEach(t=>{if(t.miss)return;const cx=(t.b[0]+t.b[2]/2)/c.width,cy=(t.b[1]+t.b[3]/2)/c.height;
  for(const z in Z){const q=Z[z];if(cx>q.x&&cx<q.x+q.w&&cy>q.y&&cy<q.y+q.h){L[z]++;if(!t.zone&&t.age>=3){t.zone=z;add(t,z)}}}});
 S.live=L}
function add(t,z){const o=document.createElement('canvas');o.width=o.height=72;const[x,y,w,h]=t.b,s=Math.max(w,h)*1.25,k=S.k;
 try{o.getContext('2d').drawImage(S.src,(x+w/2-s/2)/k,(y+h/2-s/2)/k,s/k,s/k,0,0,72,72)}catch(e){}
 S.objs.push({id:t.id,cls:t.cls,zone:z,ok:1,at:S.el,img:o.toDataURL('image/jpeg',.6)})}
const cnt=(z,cut)=>{const r={};K.forEach(k=>r[k]=0);S.objs.forEach(o=>{if(o.ok&&(!z||o.zone==z)&&(cut==null||o.at<=cut))r[o.cls]++});return r};
/* ---------- drawing ---------- */
function draw(){X.drawImage(S.src||dc,0,0,c.width,c.height);const W=c.width,H=c.height,f=W/640;
 for(const z in Z){const q=Z[z],x=q.x*W,y=q.y*H,w=q.w*W,h=q.h*H;X.fillStyle=q.c+'30';X.fillRect(x,y,w,h);X.strokeStyle=q.c;X.lineWidth=2*f;X.strokeRect(x,y,w,h);
  X.font=`700 ${15*f}px system-ui`;X.textAlign='center';X.fillStyle='#000a';X.fillRect(x+w/2-18*f,y-1,36*f,22*f);X.fillStyle='#fff';X.fillText(S.live[z],x+w/2,y+16*f);
  if(S.edit){X.fillStyle=q.c;X.fillRect(x+w-12*f,y+h-12*f,16*f,16*f);X.textAlign='left';X.fillText(q.n,x+6*f,y+h-6*f)}}
 X.textAlign='left';X.font=`600 ${12*f}px system-ui`;
 S.tracks.forEach(t=>{if(t.miss||t.age<2)return;const[x,y,w,h]=t.b,col=COL[t.cls]||'#fff',tx=t.cls[0].toUpperCase()+t.cls.slice(1);
  X.strokeStyle=col;X.lineWidth=1.5*f;X.strokeRect(x,y,w,h);const tw=X.measureText(tx).width+8*f;X.fillStyle=col+'cc';X.fillRect(x,y-15*f,tw,15*f);X.fillStyle='#000';X.fillText(tx,x+4*f,y-4*f)});
 X.fillStyle='#0009';X.fillRect(0,0,W,22*f);X.fillStyle='#fff';X.fillText(new Date().toLocaleString(),6*f,15*f);
 if(rec&&rec.state=='recording'){X.fillStyle='#ef4444';X.beginPath();X.arc(W-14*f,11*f,6*f,0,7);X.fill()}}
function graph(cv,z){const g=cv.getContext('2d'),W=cv.width,H=cv.height,h=S.hist;g.clearRect(0,0,W,H);
 const p={l:36,r:10,t:10,b:24},S2=h.map(e=>({t:e.t,c:cnt(z,e.el)}));
 g.strokeStyle='#ffffff18';g.fillStyle='#aaa';g.font='11px system-ui';g.textAlign='right';
 const fin=cnt(z),mx=Math.max(5,Object.values(fin).reduce((a,b)=>a+b,0));
 for(let i=0;i<=4;i++){const y=p.t+(H-p.t-p.b)*(1-i/4);g.beginPath();g.moveTo(p.l,y);g.lineTo(W-p.r,y);g.stroke();g.fillText(Math.round(mx*i/4),p.l-4,y+4)}
 if(S2.length<2)return;const t0=S2[0].t,t1=S2[S2.length-1].t,xx=t=>p.l+(t-t0)/(t1-t0||1)*(W-p.l-p.r),yy=n=>H-p.b-n/mx*(H-p.t-p.b);
 const ser=[['total','#d4d4d4',e=>Object.values(e.c).reduce((a,b)=>a+b,0)],...K.filter(k=>fin[k]).map(k=>[k,COL[k],e=>e.c[k]])];
 g.lineWidth=2;ser.forEach(([n,col,fn])=>{g.strokeStyle=col;g.beginPath();S2.forEach((e,i)=>{i?g.lineTo(xx(e.t),yy(fn(e))):g.moveTo(xx(e.t),yy(fn(e)))});g.stroke()});
 g.textAlign='center';g.fillStyle='#aaa';[t0,(t0+t1)/2,t1].forEach(t=>{const d=new Date(t);g.fillText(pad(d.getHours())+':'+pad(d.getMinutes()),cl(xx(t),p.l+8,W-22),H-6)})}
/* ---------- UI panels ---------- */
function list(r,hide){return K.filter(k=>!hide||r[k]).map(k=>`<div class="ls"><span>${IC[k]} ${k[0].toUpperCase()+k.slice(1)}:</span><span>${r[k]}</span></div>`).join('')}
function row(z){const r=cnt(z),q=Z[z];return `<div class="line"><b class="n"><span class="sq" style="background:${q.c}"></span>${q.n}</b>${K.slice(0,5).map(k=>`<span class="ic" style="color:${COL[k]}">${IC[k]} ${r[k]}</span>`).join('')}</div>`}
const H=(e,h)=>{if(e._h!==h){e._h=h;e.innerHTML=h}};
function ui(){$('pill').textContent=S.run?'■ Stop - '+fmt(S.el):'▶ '+(S.src?'Resume':'Start')+' - '+fmt(S.el);
 H($('boxes'),row('in')+row('out'));const a=cnt(),tot=Object.values(a).reduce((x,y)=>x+y,0);$('tt').textContent=tot;H($('tl'),list(a,1));
 $('dt').innerHTML=`${pad(S.date.getDate())}.${pad(S.date.getMonth()+1)}.${S.date.getFullYear()} at ${pad(S.date.getHours())}:${pad(S.date.getMinutes())}<br>Duration: ${fmt(S.el)}`;
 const open=[...document.querySelectorAll('canvas.g:not([hidden])')].map(e=>e.dataset.z||'');
 H($('zs'),['in','out'].map(z=>{const r=cnt(z),n=Object.values(r).reduce((x,y)=>x+y,0);
  return `<div class="card"><b><span class="sq" style="background:${Z[z].c}"></span>${Z[z].n}</b><span class="big" style="font-size:16px">${n} objects</span><div style="clear:both"></div>${list(r)}
  <button class="lk" data-v="${z}">✅ Validate Detections</button><br><button class="lk" data-g="${z}">📈 Show Graph</button><canvas class="g" data-z="${z}" width="640" height="260" ${open.includes(z)?'':'hidden'}></canvas></div>`}).join(''));
 document.querySelectorAll('canvas.g:not([hidden])').forEach(e=>graph(e,e.dataset.z||null))}
document.addEventListener('click',e=>{const b=e.target.closest('button.lk');if(!b)return;
 if(b.dataset.v){valid(b.dataset.v);return}if(b.dataset.g!=null){const cv=b.parentElement.querySelector('canvas.g');cv.hidden=!cv.hidden;ui()}});
function valid(z){$('vt').textContent='Validate Detections — '+Z[z].n;const dl=$('vd');
 const render=()=>{$('vg').innerHTML=S.objs.map((o,i)=>o.zone!=z?'':`<div class="it ${o.ok?'':'x'}"><img src="${o.img}"><select data-i="${i}">${K.map(k=>`<option ${k==o.cls?'selected':''}>${k}</option>`).join('')}</select>#${o.id} <button class="lk" data-r="${i}">${o.ok?'✕ Remove':'↺ Restore'}</button></div>`).join('')||'<span class="mu">No detections yet.</span>'};
 render();$('vg').onclick=e=>{const r=e.target.dataset.r;if(r!=null){S.objs[r].ok=!S.objs[r].ok;render();ui()}};
 $('vg').onchange=e=>{const i=e.target.dataset.i;if(i!=null){S.objs[i].cls=e.target.value;render();ui()}};dl.showModal()}
$('vx').onclick=()=>$('vd').close();
/* ---------- model + sources ---------- */
const ld=u=>new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=()=>j(new Error('Internet/CDN problem: model load hoy ni'));document.head.appendChild(s)});
async function model(){const n=$('mdl').value;if(M&&MN==n)return; if(!window.tf)await ld('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0');if(!window.cocoSsd)await ld('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3');M=await cocoSsd.load({base:n});MN=n}
function reset(){S.tracks=[];S.objs=[];S.hist=[];S.el=0;S.lh=-9;S.nid=1;S.live={in:0,out:0};S.date=new Date();dobs=[]}
function setSrc(el,w,h,kind){c.width=Math.min(w,1280);c.height=Math.round(c.width*h/w);S.k=c.width/w;S.src=el;S.kind=kind;reset();S.run=true;ui()}
function stopSrc(keep){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}v.pause();v.removeAttribute('src');v.srcObject=null;if(!keep)S.src=null}
const mload=()=>{const T=new Promise((_,j)=>setTimeout(()=>j(new Error('Model load hocche na — internet check kore page reload koro')),90000));
 return Promise.race([model(),T]).then(()=>{msg('Live ✔ — AI chalu');return 1}).catch(e=>{msg('Error: '+e.message);return 0})};
$('bCam').onclick=async()=>{try{stopSrc();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:$('cam').value,width:{ideal:1280},height:{ideal:720}},audio:false});
 v.srcObject=stream;await v.play();setSrc(v,v.videoWidth,v.videoHeight,'cam');msg('Camera chalu ✔ — AI model load hocche (1-2 min lagte pare)…');mload()}catch(e){msg('Camera error: '+e.name+' — '+e.message)}};
$('fi').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{stopSrc();v.src=URL.createObjectURL(f);v.onended=()=>{S.run=false;ui();msg('Video sesh ✔')};await v.play();setSrc(v,v.videoWidth,v.videoHeight,'file');S.run=false;v.pause();msg('AI model load hocche…');
 if(await mload()){S.run=true;v.play()}}catch(er){msg('Error: '+er.message)}};
$('bDemo').onclick=()=>{stopSrc();setSrc(dc,640,360,'demo');msg('Demo mode (simulated traffic) — AI model lage na.')};
$('pill').onclick=()=>{if(!S.src&&!S.kind){msg('Age Camera / Video / Demo select koro.');return}S.run=!S.run;if(S.kind=='file')S.run?v.play():v.pause();ui()};
$('ed').onclick=()=>{S.edit=!S.edit;c.style.touchAction=S.edit?'none':'auto';$('ed').classList.toggle('on',S.edit);msg(S.edit?'Zone-er upor drag kore sorao, kone-r square-e resize koro.':'')};
const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};

 if(Math.abs(p[0]-q.x-q.w)<.06&&Math.abs(p[1]-q.y-q.h)<.08){dr={z,m:'r'};break}
 if(p[0]>q.x&&p[0]<q.x+q.w&&p[1]>q.y&&p[1]<q.y+q.h){dr={z,m:'m',dx:p[0]-q.x,dy:p[1]-q.y};break}}if(dr)c.setPointerCapture(e.pointerId)};
c.onpointermove=e=>{if(!dr)return;const p=pt(e),q=Z[dr.z];if(dr.m=='m'){q.x=cl(p[0]-dr.dx,0,1-q.w);q.y=cl(p[1]-dr.dy,0,1-q.h)}else{q.w=cl(p[0]-q.x,.06,1-q.x);q.h=cl(p[1]-q.y,.08,1-q.y)}};

 rec.onstop=()=>{dl(new Blob(ch,{type:mt}),'cctv-'+Date.now()+(mt.includes('mp4')?'.mp4':'.webm'));$('rec').textContent='⏺ REC';$('rec').classList.remove('on')};

/* ---------- main loop ---------- */
function loop(now){const dt=Math.min(.2,(now-S.last)/1000||0);S.last=now;
